services:
  labyrinthbench:
    build: .
    container_name: labyrinthbench
    ports:
      - "8090:8090"
    # Lets the documented host.docker.internal base-URL resolve on Linux too
    # (Docker Desktop on Mac/Windows resolves it natively).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DEGS_DIR: /app/degs
    volumes:
      - .:/app
      - ./results:/results
