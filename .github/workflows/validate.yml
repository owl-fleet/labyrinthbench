# Repo integrity gate — every PR and every push to main re-derives what the repo claims:
#   1. DEG manifests load, BFS parity holds, corridors full-walk (cli/validate_degs.py) —
#      the same checks every minted instance passes at mint time, applied to the map sources.
#   2. Committed run traces replay against the manifests (cli/verify.py L1, plus the full
#      engine re-drive where a turns_log is present).
#   3. Every board entry's score block re-derives from its own run distribution (seeded
#      bootstrap, recorded seed) — an entry the board renders is an entry CI has re-computed.
# No model, no network, stdlib + pyyaml only. This is the manual-PR-era submission gate:
# an entry PR that fails replay does not exist for the board (METHODOLOGY §2 rung 1).
name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: DEG manifests — load, BFS parity, corridor walk
        run: python3 cli/validate_degs.py
      - name: Traces — replay against manifests
        # results/results.jsonl is the LOCAL run ledger and is gitignored — CI verifies
        # committed traces only (the 2026-08-06 exit-2: a working-tree file isn't a repo file)
        run: python3 cli/verify.py results/null-baseline/null_random_walk.jsonl
      - name: Entries — score blocks re-derive
        run: |
          args=""
          for e in entries/*.json; do args="$args --entry $e"; done
          python3 cli/verify.py $args

  # Server-side twin of scripts/pre-push-scan.sh (the client-side pre-push hook): the pattern
  # battery (operator identity, LAN topology, internal service names, credential shapes,
  # private notebook paths) plus gitleaks via docker. Added 2026-09-02 after PR #2 landed a
  # test file carrying real LAN addresses — the hook only guards pushes made from a checkout
  # that has it installed; this job guards the repo. Fails the PR on any hit.
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pattern battery + gitleaks (scripts/pre-push-scan.sh)
        run: bash scripts/pre-push-scan.sh
